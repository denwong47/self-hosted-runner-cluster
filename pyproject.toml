[project]
name = "ghrunner"
version = "0.1.0"
description = "CLI for a self-hosted GitHub Actions runner fleet"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2",
  "pyyaml>=6",
  "pyjwt[crypto]>=2.8",
  "requests>=2.31",
]

[project.scripts]
ghrunner = "ghrunner.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ghrunner*"]

[tool.setuptools.package-data]
ghrunner = ["templates/*"]
